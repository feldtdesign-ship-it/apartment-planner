<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apartment Planner</title>
<style>
:root{
  --ink:#ffffff; --panel:#ffffff; --panel2:#fbfbfa; --line:#dcdcd8;
  --text:#1a1a1a; --dim:#6d6d68; --faint:#9a9a94;
  --teal:#2a7d8e; --bad:#c1443c;
  --ui:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font-family:var(--ui);font-size:13px;
     display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
.bar{display:flex;align-items:center;gap:10px 12px;padding:8px 14px;min-height:52px;
     background:#fff;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.brand{font-size:11px;letter-spacing:.22em;color:var(--dim);white-space:nowrap}
.sp{flex:1}
input[type=text]{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  font-family:var(--ui);font-size:13px;padding:6px 9px;border-radius:3px;min-width:190px}
input[type=text]:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:-1px}
button{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  font-family:var(--ui);font-size:12px;padding:6px 11px;border-radius:3px;cursor:pointer;white-space:nowrap}
button:hover{border-color:#a9a9a3;background:#f0f0ec}
button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
button.go{background:#1a1a1a;border-color:#1a1a1a;color:#fff;font-weight:600}
button.go:hover{background:#333}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
label.chk{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px;cursor:pointer}
.shell{flex:1;display:flex;min-height:0}
main{flex:1;min-width:0;position:relative;overflow:hidden;
     background:#f4f4f1}
#stage{position:absolute;inset:0;cursor:grab}
#stage.panning{cursor:grabbing}
#sheet{position:absolute;top:0;left:0;transform-origin:0 0;box-shadow:0 1px 14px rgba(0,0,0,.10)}
aside{width:272px;flex:none;background:#fafaf8;border-left:1px solid var(--line);
      display:flex;flex-direction:column;min-height:0}
.head{padding:12px 14px 6px;font-size:10px;letter-spacing:.18em;color:var(--faint);flex:none}
.scroll{overflow-y:auto;padding:0 12px 20px}
.scroll::-webkit-scrollbar{width:9px}
.scroll::-webkit-scrollbar-thumb{background:#cfcfc9;border-radius:5px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:12px;margin-bottom:10px}
.card h4{margin:0 0 8px;font-size:13px;font-weight:600;line-height:1.3;display:flex;align-items:center;gap:7px}
.card h4 i{width:3px;height:15px;border-radius:2px;flex:none}
.kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-family:var(--mono);font-size:11px}
.kv span:first-child{color:var(--faint)}
.kv.warn span:last-child{color:var(--bad)}
.row{display:flex;gap:6px;margin-top:9px}
.row button{flex:1;padding:6px 4px}
.tally{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;padding:3px 0;color:var(--dim)}
.tally b{color:var(--text);font-weight:500}
.empty{color:var(--faint);font-size:12px;padding:8px 4px;line-height:1.6}
textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
  font-family:var(--ui);font-size:11.5px;padding:8px;border-radius:3px;resize:vertical;
  min-height:64px;line-height:1.5}
.hint{position:absolute;left:16px;bottom:14px;color:var(--faint);font-size:11px;
      font-family:var(--mono);pointer-events:none;line-height:1.6}
.zoombox{position:absolute;right:16px;bottom:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="bar">
  <span class="brand">ONE BEDROOM APARTMENT &nbsp;/&nbsp; FURNITURE PLANNER</span>
  <input type="text" id="title" value="Layout" aria-label="Sheet title">
  <div class="seg">
    <button id="undo">Undo</button>
    <button id="clearAll">Send all back</button>
  </div>
  <span class="sp"></span>
  <label class="chk"><input type="checkbox" id="tClear"> Clearance zones</label>
  <label class="chk"><input type="checkbox" id="tSnap" checked> Snap to walls</label>
  <label class="chk"><input type="checkbox" id="tSched" checked> Schedule on sheet</label>
  <div class="seg">
    <button id="saveJson">Save file</button>
    <button id="loadJson">Open file</button>
  </div>
  <button id="png">Save PNG</button>
  <button class="go" id="pdf">Save PDF</button>
</div>

<div class="shell">
  <main>
    <div id="stage"><div id="sheet"></div></div>
    <div class="hint" id="hint"></div>
    <div class="zoombox"><div class="seg">
      <button id="zOut">&minus;</button><button id="zPlan">Plan</button>
      <button id="zAll">All</button><button id="zIn">+</button>
    </div></div>
  </main>

  <aside>
    <div class="head">SELECTION</div>
    <div class="scroll">
      <div id="insp"></div>
      <div class="head" style="padding-left:2px">SHEET</div>
      <div class="card">
        <div class="tally"><span>On the plan</span><b id="nOn">0 of 36</b></div>
        <div class="tally"><span>Floor used</span><b id="nSf">0 sf</b></div>
      </div>
      <div class="head" style="padding-left:2px">NOTES ON THE SHEET</div>
      <textarea id="notes" placeholder="Anything typed here prints under the plan."></textarea>
    </div>
  </aside>
</div>

<input type="file" id="fileIn" accept=".json" style="display:none">

<script>
/* ===================================================================
   Minimal vector PDF writer. Takes the sheet SVG and emits a real
   .pdf file. Base-14 Helvetica, no external libraries.
   =================================================================== */
const PDF = (function(){

function esc(s){ return s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)'); }
function n(v){ return (Math.round(v*1000)/1000).toString(); }

/* --- 2x3 affine matrices in SVG convention [a,b,c,d,e,f] --- */
const I = [1,0,0,1,0,0];
function mul(m,o){ return [
  m[0]*o[0]+m[2]*o[1], m[1]*o[0]+m[3]*o[1],
  m[0]*o[2]+m[2]*o[3], m[1]*o[2]+m[3]*o[3],
  m[0]*o[4]+m[2]*o[5]+m[4], m[1]*o[4]+m[3]*o[5]+m[5]];
}
function apply(m,x,y){ return [m[0]*x+m[2]*y+m[4], m[1]*x+m[3]*y+m[5]]; }
function scaleOf(m){ return Math.sqrt(Math.abs(m[0]*m[3]-m[1]*m[2])) || 1; }

function parseTransform(t){
  let m = I;
  if(!t) return m;
  const re = /(matrix|translate|scale|rotate)\s*\(([^)]*)\)/g; let x;
  while((x = re.exec(t))){
    const v = x[2].trim().split(/[\s,]+/).map(Number);
    if(x[1]==='matrix')      m = mul(m, v);
    else if(x[1]==='translate') m = mul(m, [1,0,0,1,v[0],v[1]||0]);
    else if(x[1]==='scale')     m = mul(m, [v[0],0,0,v.length>1?v[1]:v[0],0,0]);
    else if(x[1]==='rotate'){
      const a=v[0]*Math.PI/180, c=Math.cos(a), s=Math.sin(a);
      let r=[c,s,-s,c,0,0];
      if(v.length>2) r = mul(mul([1,0,0,1,v[1],v[2]], r), [1,0,0,1,-v[1],-v[2]]);
      m = mul(m, r);
    }
  }
  return m;
}

/* --- text measurement uses a canvas with the same face --- */
const mc = document.createElement('canvas').getContext('2d');
function textWidth(str, size, bold){
  mc.font = (bold?'bold ':'')+size+'px Helvetica, Arial, sans-serif';
  return mc.measureText(str).width;
}

/* --- SVG path data -> PDF path operators --- */
function pathOps(d, m, out){
  const tok = d.match(/[MmZzLlHhVvCcSsQqTtAa]|-?\d*\.?\d+(?:e[-+]?\d+)?/gi) || [];
  let i=0, cx=0, cy=0, sx=0, sy=0, cmd='';
  const num = ()=> parseFloat(tok[i++]);
  const moveTo=(x,y)=>{ const p=apply(m,x,y); out.push(n(p[0])+' '+n(p[1])+' m'); };
  const lineTo=(x,y)=>{ const p=apply(m,x,y); out.push(n(p[0])+' '+n(p[1])+' l'); };
  const curve=(x1,y1,x2,y2,x,y)=>{ const a=apply(m,x1,y1),b=apply(m,x2,y2),c=apply(m,x,y);
    out.push([n(a[0]),n(a[1]),n(b[0]),n(b[1]),n(c[0]),n(c[1]),'c'].join(' ')); };
  while(i<tok.length){
    if(/[A-Za-z]/.test(tok[i])) cmd = tok[i++];
    switch(cmd){
      case 'M': cx=num(); cy=num(); sx=cx; sy=cy; moveTo(cx,cy); cmd='L'; break;
      case 'm': cx+=num(); cy+=num(); sx=cx; sy=cy; moveTo(cx,cy); cmd='l'; break;
      case 'L': cx=num(); cy=num(); lineTo(cx,cy); break;
      case 'l': cx+=num(); cy+=num(); lineTo(cx,cy); break;
      case 'H': cx=num(); lineTo(cx,cy); break;
      case 'h': cx+=num(); lineTo(cx,cy); break;
      case 'V': cy=num(); lineTo(cx,cy); break;
      case 'v': cy+=num(); lineTo(cx,cy); break;
      case 'C':{ const a=num(),b=num(),c=num(),d2=num(),e=num(),f=num();
        curve(a,b,c,d2,e,f); cx=e; cy=f; break; }
      case 'c':{ const a=cx+num(),b=cy+num(),c=cx+num(),d2=cy+num(),e=cx+num(),f=cy+num();
        curve(a,b,c,d2,e,f); cx=e; cy=f; break; }
      case 'Z': case 'z': out.push('h'); cx=sx; cy=sy; break;
      default: i++;                       // unsupported command, skip a token
    }
  }
}

function rectOps(x,y,w,h,rx,m,out){
  if(!rx){
    const p=[apply(m,x,y),apply(m,x+w,y),apply(m,x+w,y+h),apply(m,x,y+h)];
    out.push(n(p[0][0])+' '+n(p[0][1])+' m');
    for(let k=1;k<4;k++) out.push(n(p[k][0])+' '+n(p[k][1])+' l');
    out.push('h'); return;
  }
  const r=Math.min(rx,w/2,h/2), K=0.5523*r;
  const P=(a,b)=>apply(m,a,b);
  const M=(p)=>out.push(n(p[0])+' '+n(p[1])+' m');
  const L=(p)=>out.push(n(p[0])+' '+n(p[1])+' l');
  const C=(a,b,c)=>out.push([n(a[0]),n(a[1]),n(b[0]),n(b[1]),n(c[0]),n(c[1]),'c'].join(' '));
  M(P(x+r,y)); L(P(x+w-r,y));
  C(P(x+w-r+K,y),P(x+w,y+r-K),P(x+w,y+r)); L(P(x+w,y+h-r));
  C(P(x+w,y+h-r+K),P(x+w-r+K,y+h),P(x+w-r,y+h)); L(P(x+r,y+h));
  C(P(x+r-K,y+h),P(x,y+h-r+K),P(x,y+h-r)); L(P(x,y+r));
  C(P(x,y+r-K),P(x+r-K,y),P(x+r,y)); out.push('h');
}

function ellipseOps(cx,cy,rx,ry,m,out){
  const K=0.5523, P=(a,b)=>apply(m,a,b);
  const C=(a,b,c)=>out.push([n(a[0]),n(a[1]),n(b[0]),n(b[1]),n(c[0]),n(c[1]),'c'].join(' '));
  out.push(n(P(cx+rx,cy)[0])+' '+n(P(cx+rx,cy)[1])+' m');
  C(P(cx+rx,cy+ry*K),P(cx+rx*K,cy+ry),P(cx,cy+ry));
  C(P(cx-rx*K,cy+ry),P(cx-rx,cy+ry*K),P(cx-rx,cy));
  C(P(cx-rx,cy-ry*K),P(cx-rx*K,cy-ry),P(cx,cy-ry));
  C(P(cx+rx*K,cy-ry),P(cx+rx,cy-ry*K),P(cx+rx,cy));
  out.push('h');
}

function col(c){
  if(!c || c==='none') return null;
  if(c[0]==='#'){
    let h=c.slice(1);
    if(h.length===3) h=h.split('').map(x=>x+x).join('');
    return [parseInt(h.slice(0,2),16)/255, parseInt(h.slice(2,4),16)/255, parseInt(h.slice(4,6),16)/255];
  }
  if(c==='white') return [1,1,1];
  if(c==='black') return [0,0,0];
  return null;
}

/* --- walk the SVG DOM and build the content stream --- */
function build(svgText, W, H){
  const doc = new DOMParser().parseFromString(svgText,'image/svg+xml');
  const root = doc.documentElement;
  const out = ['1 J','1 j', '1 0 0 -1 0 '+n(H)+' cm'];   // flip to SVG y-down

  function attr(el,k,inh){ const v=el.getAttribute(k); return (v===null||v==='')?inh:v; }

  function paint(el, m, inh){
    const fill   = attr(el,'fill',   inh.fill);
    const stroke = attr(el,'stroke', inh.stroke);
    const swAttr = attr(el,'stroke-width', inh.sw);
    const sw = parseFloat(swAttr===undefined?1:swAttr) * scaleOf(m);
    const f = col(fill), s = col(stroke);
    let op = '';
    if(f){ out.push(n(f[0])+' '+n(f[1])+' '+n(f[2])+' rg'); op += 'f'; }
    if(s && sw>0){ out.push(n(s[0])+' '+n(s[1])+' '+n(s[2])+' RG');
                   out.push(n(Math.max(sw,0.12))+' w'); op = op ? 'B' : 'S'; }
    const da = attr(el,'stroke-dasharray', null);
    if(da) out.push('['+da.trim().split(/[\s,]+/).map(v=>n(parseFloat(v)*scaleOf(m))).join(' ')+'] 0 d');
    return {op, dash: !!da};
  }

  function drawText(el, m, inh){
    const str = (el.textContent||'').trim();
    if(!str) return;
    const size = parseFloat(attr(el,'font-size', inh.fs) || 10);
    const anchor = attr(el,'text-anchor', inh.anchor) || 'start';
    const ls = parseFloat(attr(el,'letter-spacing','0')) || 0;
    const bold = (attr(el,'font-weight','') + '') === 'bold';
    const x = parseFloat(el.getAttribute('x')||0), y = parseFloat(el.getAttribute('y')||0);
    const tm = mul(m, parseTransform(el.getAttribute('transform')));
    const w = textWidth(str,size,bold) + ls*Math.max(str.length-1,0);
    let dx = 0;
    if(anchor==='middle') dx = -w/2; else if(anchor==='end') dx = -w;
    const p = mul(tm, [1,0,0,1,x+dx,y]);
    const Tm = [p[0],p[1],-p[2],-p[3],p[4],p[5]];
    const fill = col(attr(el,'fill', inh.fill));
    const stroke = col(attr(el,'stroke','none'));
    const sw = parseFloat(attr(el,'stroke-width','0')) * scaleOf(m);
    const emit = (mode)=>{
      out.push('BT','/F'+(bold?2:1)+' '+n(size*scaleOf(tm))+' Tf');
      if(ls) out.push(n(ls*scaleOf(tm))+' Tc');
      out.push(mode+' Tr');
      out.push([n(Tm[0]),n(Tm[1]),n(Tm[2]),n(Tm[3]),n(Tm[4]),n(Tm[5]),'Tm'].join(' '));
      out.push('('+esc(str)+') Tj');
      if(ls) out.push('0 Tc');
      out.push('0 Tr','ET');
    };
    if(stroke && sw>0){                       // halo first
      out.push(n(stroke[0])+' '+n(stroke[1])+' '+n(stroke[2])+' RG');
      out.push(n(sw)+' w'); emit('1');
    }
    if(fill){ out.push(n(fill[0])+' '+n(fill[1])+' '+n(fill[2])+' rg'); emit('0'); }
  }

  function walk(el, m, inh){
    for(const ch of el.children){
      const tag = ch.tagName.toLowerCase();
      if(tag==='style'||tag==='defs'||tag==='title') continue;
      const cm = mul(m, parseTransform(ch.getAttribute('transform')));
      const ii = {
        fill:   ch.getAttribute('fill')   || inh.fill,
        stroke: ch.getAttribute('stroke') || inh.stroke,
        sw:     ch.getAttribute('stroke-width') || inh.sw,
        fs:     ch.getAttribute('font-size') || inh.fs,
        anchor: ch.getAttribute('text-anchor') || inh.anchor,
      };
      if(tag==='g'){ walk(ch, cm, ii); continue; }
      if(tag==='text'){ drawText(ch, cm, inh); continue; }
      const seg = [];
      if(tag==='rect') rectOps(+ch.getAttribute('x')||0, +ch.getAttribute('y')||0,
        +ch.getAttribute('width')||0, +ch.getAttribute('height')||0,
        +ch.getAttribute('rx')||0, cm, seg);
      else if(tag==='line'){ const a=apply(cm,+ch.getAttribute('x1'),+ch.getAttribute('y1')),
        b=apply(cm,+ch.getAttribute('x2'),+ch.getAttribute('y2'));
        seg.push(n(a[0])+' '+n(a[1])+' m', n(b[0])+' '+n(b[1])+' l'); }
      else if(tag==='polygon'||tag==='polyline'){
        const v=(ch.getAttribute('points')||'').trim().split(/[\s,]+/).map(Number);
        for(let k=0;k<v.length-1;k+=2){ const p=apply(cm,v[k],v[k+1]);
          seg.push(n(p[0])+' '+n(p[1])+(k?' l':' m')); }
        if(tag==='polygon') seg.push('h');
      }
      else if(tag==='path') pathOps(ch.getAttribute('d')||'', cm, seg);
      else if(tag==='circle') ellipseOps(+ch.getAttribute('cx')||0,+ch.getAttribute('cy')||0,
        +ch.getAttribute('r')||0,+ch.getAttribute('r')||0, cm, seg);
      else if(tag==='ellipse') ellipseOps(+ch.getAttribute('cx')||0,+ch.getAttribute('cy')||0,
        +ch.getAttribute('rx')||0,+ch.getAttribute('ry')||0, cm, seg);
      else continue;
      if(!seg.length) continue;
      out.push('q');
      const st = paint(ch, cm, inh);
      out.push(...seg);
      out.push(st.op || 'n');
      out.push('Q');
    }
  }
  walk(root, I, {fill:'#000', stroke:'none', sw:'1', fs:'10', anchor:'start'});
  return out.join('\n');
}

function make(svgText, W, H){
  const content = build(svgText, W, H);
  const objs = [];
  objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  objs[2] = '<< /Type /Pages /Kids [3 0 R] /Count 1 >>';
  objs[3] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+n(W)+' '+n(H)+'] '+
            '/Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> /Contents 4 0 R >>';
  objs[4] = '<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream';
  objs[5] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[6] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';

  let pdf = '%PDF-1.4\n';
  const off = [];
  for(let i=1;i<objs.length;i++){
    off[i] = pdf.length;
    pdf += i+' 0 obj\n'+objs[i]+'\nendobj\n';
  }
  const xref = pdf.length;
  pdf += 'xref\n0 '+objs.length+'\n0000000000 65535 f \n';
  for(let i=1;i<objs.length;i++) pdf += String(off[i]).padStart(10,'0')+' 00000 n \n';
  pdf += 'trailer\n<< /Size '+objs.length+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF';

  const bytes = new Uint8Array(pdf.length);
  for(let i=0;i<pdf.length;i++) bytes[i] = pdf.charCodeAt(i) & 0xff;
  return new Blob([bytes], {type:'application/pdf'});
}

return { make };
})();

/* ======================= constants ======================= */
const UPI = 3, UPF = 36;
const PB  = [124.15,153.14,1660.15,1094.14];
const INV_TOP = 1160;
let   INV_BOT = 1700;
const INK = {soft:'#6baab8', table:'#de9244', case:'#b5aad0', lamp:'#de9244', head:'#9aa1a9'};
const CATBY = Object.fromEntries(DATA.cat.map(c=>[c.key,c]));
const PAGE = {w:1224,h:792,S:0.62,x:44,y:92};

let pieces = [], sel = null, uid = 1, undoStack = [];
let view = {z:1,x:0,y:0};
const $ = s => document.querySelector(s);
const stage = $('#stage'), sheetEl = $('#sheet');

/* ======================= geometry ======================= */
function dims(p){ const c=CATBY[p.key];
  return (p.rot%180) ? [c.d*UPI,c.w*UPI] : [c.w*UPI,c.d*UPI]; }
function bbox(p){ const [w,h]=dims(p); return [p.cx-w/2,p.cy-h/2,p.cx+w/2,p.cy+h/2]; }
function placed(p){ return p.cy < INV_TOP - 10; }
function olap(a,b,t){ t=t||0.5;
  return !(a[2]-t<=b[0]||b[2]-t<=a[0]||a[3]-t<=b[1]||b[3]-t<=a[1]); }
function inAnyRoom(bb){
  for(const k in DATA.rooms){ const r=DATA.rooms[k];
    if(bb[0]>=r[0]-.5&&bb[1]>=r[1]-.5&&bb[2]<=r[2]+.5&&bb[3]<=r[3]+.5) return k; }
  return null;
}
function tucks(a,b){ return CATBY[a.key].shape==='chair' && CATBY[b.key].fam==='table'; }
function conflicts(p){
  if(!placed(p)) return [];
  const bb=bbox(p), out=[];
  if(!inAnyRoom(bb)) out.push('outside a room');
  for(const f of DATA.fixed) if(olap(bb,f)) out.push(f[4]);
  for(const c of DATA.circ)  if(olap(bb,c)) out.push(c[4]);
  if(!p.free) for(const q of pieces){
    if(q===p||!placed(q)||q.free||!olap(bb,bbox(q))) continue;
    if(tucks(p,q)||tucks(q,p)) continue;
    out.push(CATBY[q.key].name.toLowerCase());
  }
  return [...new Set(out)];
}
function ftin(u){ const i=u/UPI, f=Math.floor(i/12), r=Math.round(i-f*12);
  if(r===12) return (f+1)+"'-0\"";
  return f ? f+"'-"+r+'"' : r+'"'; }
function gap(u){ return u==null ? '\u2014' : (u<1 ? 'flush' : ftin(u)); }
function clearance(p){
  const bb=bbox(p), obs=DATA.blockers.concat(pieces.filter(q=>q!==p&&placed(q)).map(bbox));
  let L=-1e9,R=1e9,T=-1e9,B=1e9;
  for(const o of obs){
    if(o[1]<bb[3]-1&&o[3]>bb[1]+1){
      if(o[2]<=bb[0]+1) L=Math.max(L,o[2]);
      if(o[0]>=bb[2]-1) R=Math.min(R,o[0]); }
    if(o[0]<bb[2]-1&&o[2]>bb[0]+1){
      if(o[3]<=bb[1]+1) T=Math.max(T,o[3]);
      if(o[1]>=bb[3]-1) B=Math.min(B,o[1]); }
  }
  return { l:L>-1e8?bb[0]-L:null, r:R<1e8?R-bb[2]:null,
           t:T>-1e8?bb[1]-T:null, b:B<1e8?B-bb[3]:null };
}

/* ======================= inventory packing ======================= */
let INV_HEADS=[];
function packInventory(){
  const GAP=26, X0=PB[0]+30, X1=PB[2]-30, LBL=16;
  const order=[...new Set(DATA.cat.map(c=>c.grp))];
  let y=INV_TOP+50;
  INV_HEADS=[];
  for(const g of order){
    INV_HEADS.push({t:g, x:X0, y:y+14});
    y+=34;
    let x=X0, rowH=0;
    for(const c of DATA.cat.filter(c=>c.grp===g).sort((a,b)=>(b.w*b.d)-(a.w*a.d))){
      const w=c.w*UPI, h=c.d*UPI;
      if(x+w>X1){ x=X0; y+=rowH+GAP+LBL; rowH=0; }
      c.home={cx:x+w/2, cy:y+h/2};
      x+=w+GAP; rowH=Math.max(rowH,h);
    }
    y+=rowH+52;
  }
  INV_BOT=y+20;
}
function canvasBox(){ return [PB[0],PB[1],PB[2],INV_BOT]; }

/* ======================= shapes ======================= */
function disp(c){ return c.name || ('unlabelled  '+num(c.w)+'\u2033 \u00d7 '+num(c.d)+'\u2033'); }
function num(v){ return (Math.round(v*10)/10).toString(); }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function shape(p, mode){
  if(mode==='label') return '';
  return CATBY[p.key].art;          // the piece exactly as drawn in the source file
}

/* ======================= plan chrome ======================= */
function clearOverlay(){
  if(!$('#tClear').checked) return '';
  return DATA.circ.concat(DATA.fixed).map(r=>
    `<rect x="${r[0]}" y="${r[1]}" width="${r[2]-r[0]}" height="${r[3]-r[1]}"
     fill="none" stroke="#de9244" stroke-width="1" stroke-dasharray="7 5"/>`).join('');
}
function inventoryChrome(){
  const F='font-family="Helvetica,Arial,sans-serif"';
  return `<line x1="${PB[0]}" y1="${INV_TOP}" x2="${PB[2]}" y2="${INV_TOP}"
    stroke="#c8c8c2" stroke-width="1.5" stroke-dasharray="12 8"/>
   <text ${F} x="${PB[0]+26}" y="${INV_TOP+34}" font-size="19" letter-spacing="4.5" fill="#8a8a84">INVENTORY</text>
   <text ${F} x="${PB[0]+250}" y="${INV_TOP+34}" font-size="12" letter-spacing="1" fill="#a8a8a2"></text>`
   + INV_HEADS.map(s=>`<text ${F} x="${s.x}" y="${s.y}" font-size="13" letter-spacing="2.2" fill="#8a8a84">${esc(s.t.toUpperCase())}</text>`).join('');
}

/* ======================= render ======================= */
function render(){
  const cb=canvasBox(), w=cb[2]-cb[0], h=cb[3]-cb[1], o=[];
  o.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${cb[0]} ${cb[1]} ${w} ${h}" width="${w}" height="${h}" style="display:block">`);
  o.push(`<rect x="${cb[0]}" y="${cb[1]}" width="${w}" height="${h}" fill="#ffffff"/>`);
  o.push(DATA.body, clearOverlay(), inventoryChrome());
  for(const p of pieces)
    o.push(`<g class="pc" data-id="${p.id}" transform="translate(${p.cx},${p.cy}) rotate(${p.rot})" style="cursor:move">${shape(p,'body')}</g>`);
  for(const p of [...pieces].sort((a,b)=>{const A=dims(a),B=dims(b);return A[0]*A[1]-B[0]*B[1];}))
    o.push(`<g transform="translate(${p.cx},${p.cy}) rotate(${p.rot})" style="pointer-events:none">${shape(p,'label')}</g>`);
  const s=sel&&pieces.find(q=>q.id===sel);
  if(s){ const b=bbox(s);
    o.push(`<rect x="${b[0]-4}" y="${b[1]-4}" width="${b[2]-b[0]+8}" height="${b[3]-b[1]+8}" fill="none" stroke="#6baab8" stroke-width="2.6" style="pointer-events:none"/>`);
    if(placed(s)) o.push(dimLines(s)); }
  o.push('</svg>');
  sheetEl.innerHTML=o.join('');
  applyView(); wireDrag(); paintInspector();
}
function dimLines(p){
  const b=bbox(p), c=clearance(p), o=[];
  const F='font-family="Helvetica,Arial,sans-serif" text-anchor="middle" font-size="12"';
  const T=(x1,y1,x2,y2,tx,ty,txt,vert)=>{
    o.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#6baab8" stroke-width="1.1"/>`);
    const tick=(x,y)=> vert
      ? `<line x1="${x-5}" y1="${y}" x2="${x+5}" y2="${y}" stroke="#6baab8" stroke-width="1.1"/>`
      : `<line x1="${x}" y1="${y-5}" x2="${x}" y2="${y+5}" stroke="#6baab8" stroke-width="1.1"/>`;
    o.push(tick(x1,y1),tick(x2,y2));
    const r=vert?` transform="rotate(-90 ${tx} ${ty})"`:'';
    o.push(`<text ${F} x="${tx}" y="${ty}"${r} fill="none" stroke="#ffffff" stroke-width="3.6">${txt}</text>`);
    o.push(`<text ${F} x="${tx}" y="${ty}"${r} fill="#2a7d8e">${txt}</text>`);
  };
  const my=(b[1]+b[3])/2, mx=(b[0]+b[2])/2;
  if(c.l!=null&&c.l>2) T(b[0]-c.l,my,b[0],my,b[0]-c.l/2,my-6,ftin(c.l),false);
  if(c.r!=null&&c.r>2) T(b[2],my,b[2]+c.r,my,b[2]+c.r/2,my-6,ftin(c.r),false);
  if(c.t!=null&&c.t>2) T(mx,b[1]-c.t,mx,b[1],mx+4,b[1]-c.t/2,ftin(c.t),true);
  if(c.b!=null&&c.b>2) T(mx,b[3],mx,b[3]+c.b,mx+4,b[3]+c.b/2,ftin(c.b),true);
  return o.join('');
}

/* ======================= view ======================= */
function applyView(){
  const cb=canvasBox();
  sheetEl.style.width=(cb[2]-cb[0])+'px';
  sheetEl.style.height=(cb[3]-cb[1])+'px';
  sheetEl.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.z})`;
}
function fitBox(bx){
  const r=stage.getBoundingClientRect(), cb=canvasBox();
  const z=Math.min((r.width-60)/(bx[2]-bx[0]),(r.height-60)/(bx[3]-bx[1]));
  view.z=z;
  view.x=(r.width-(bx[2]-bx[0])*z)/2-(bx[0]-cb[0])*z;
  view.y=(r.height-(bx[3]-bx[1])*z)/2-(bx[1]-cb[1])*z;
  applyView();
}
function toPlan(ev){
  const r=stage.getBoundingClientRect(), cb=canvasBox();
  return { x: cb[0]+(ev.clientX-r.left-view.x)/view.z,
           y: cb[1]+(ev.clientY-r.top -view.y)/view.z };
}

/* ======================= interaction ======================= */
function snapshot(){ return JSON.stringify(pieces.map(p=>({id:p.id,key:p.key,cx:p.cx,cy:p.cy,rot:p.rot,free:!!p.free}))); }
function push(){ undoStack.push(snapshot()); if(undoStack.length>80) undoStack.shift(); }
function doUndo(){
  const s=undoStack.pop(); if(!s) return;
  const d=JSON.parse(s);
  pieces=d.map(x=>({id:x.id,key:x.key,cx:x.cx,cy:x.cy,rot:x.rot,free:x.free}));
  sel=null; render();
}
function snap(p){
  p.cx=Math.round(p.cx/UPI*2)/2*UPI; p.cy=Math.round(p.cy/UPI*2)/2*UPI;
  if(!$('#tSnap').checked || !placed(p)) return;
  const b=bbox(p), MAG=14; let dx=0,dy=0,bx=MAG,by=MAG;
  const obs=DATA.blockers.concat(pieces.filter(q=>q!==p&&placed(q)).map(bbox));
  for(const o of obs){
    if(o[1]<b[3]&&o[3]>b[1]){
      if(Math.abs(b[0]-o[2])<bx){bx=Math.abs(b[0]-o[2]);dx=o[2]-b[0];}
      if(Math.abs(b[2]-o[0])<bx){bx=Math.abs(b[2]-o[0]);dx=o[0]-b[2];}
    }
    if(o[0]<b[2]&&o[2]>b[0]){
      if(Math.abs(b[1]-o[3])<by){by=Math.abs(b[1]-o[3]);dy=o[3]-b[1];}
      if(Math.abs(b[3]-o[1])<by){by=Math.abs(b[3]-o[1]);dy=o[1]-b[3];}
    }
  }
  p.cx+=dx; p.cy+=dy;
}
function wireDrag(){
  sheetEl.querySelectorAll('.pc').forEach(g=>{
    g.addEventListener('pointerdown',ev=>{
      ev.stopPropagation(); ev.preventDefault();
      const p=pieces.find(q=>q.id===+g.dataset.id);
      sel=p.id; push();
      const s=toPlan(ev), off={x:p.cx-s.x,y:p.cy-s.y};
      let moved=false;
      const mv=e=>{ const q=toPlan(e); p.cx=q.x+off.x; p.cy=q.y+off.y; snap(p); moved=true; render(); };
      const up=()=>{ window.removeEventListener('pointermove',mv);
        window.removeEventListener('pointerup',up);
        if(!moved) undoStack.pop(); render(); };
      window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up);
      render();
    });
  });
}
stage.addEventListener('pointerdown',ev=>{
  if(ev.target.closest('.pc')) return;
  const st={x:ev.clientX,y:ev.clientY}, v0={x:view.x,y:view.y}; let moved=false;
  stage.classList.add('panning');
  const mv=e=>{ if(Math.hypot(e.clientX-st.x,e.clientY-st.y)>3) moved=true;
    view.x=v0.x+(e.clientX-st.x); view.y=v0.y+(e.clientY-st.y); applyView(); };
  const up=()=>{ window.removeEventListener('pointermove',mv);
    window.removeEventListener('pointerup',up); stage.classList.remove('panning');
    if(!moved){ sel=null; render(); } };
  window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up);
});
stage.addEventListener('wheel',ev=>{
  ev.preventDefault();
  const r=stage.getBoundingClientRect(), mx=ev.clientX-r.left, my=ev.clientY-r.top;
  const nz=Math.min(5,Math.max(.08,view.z*Math.exp(-ev.deltaY*0.0016)));
  view.x=mx-(mx-view.x)*(nz/view.z); view.y=my-(my-view.y)*(nz/view.z);
  view.z=nz; applyView();
},{passive:false});

function zMove(p,delta){
  const i=pieces.indexOf(p); let j;
  if(delta==='front') j=pieces.length-1;
  else if(delta==='back') j=0;
  else j=Math.max(0,Math.min(pieces.length-1,i+delta));
  if(i===j) return;
  push(); pieces.splice(i,1); pieces.splice(j,0,p); render();
}
function sendHome(p){ const h=CATBY[p.key].home; p.cx=h.cx; p.cy=h.cy; p.rot=0; }

window.addEventListener('keydown',ev=>{
  if(/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName)) return;
  if((ev.metaKey||ev.ctrlKey)&&ev.key.toLowerCase()==='z'){ ev.preventDefault(); doUndo(); return; }
  if(ev.key==='Escape'){ sel=null; render(); return; }
  const p=sel&&pieces.find(q=>q.id===sel); if(!p) return;
  const step=ev.shiftKey?UPI*6:UPI;
  if(ev.key==='r'||ev.key==='R'){ push(); p.rot=(p.rot+90)%360; render(); ev.preventDefault(); }
  else if(ev.key===']'){ zMove(p,(ev.metaKey||ev.ctrlKey)?'front':1); ev.preventDefault(); }
  else if(ev.key==='['){ zMove(p,(ev.metaKey||ev.ctrlKey)?'back':-1); ev.preventDefault(); }
  else if(ev.key==='Backspace'||ev.key==='Delete'){ push(); sendHome(p); render(); ev.preventDefault(); }
  else if(ev.key.indexOf('Arrow')===0){ push();
    if(ev.key==='ArrowLeft')p.cx-=step; if(ev.key==='ArrowRight')p.cx+=step;
    if(ev.key==='ArrowUp')p.cy-=step;   if(ev.key==='ArrowDown')p.cy+=step;
    render(); ev.preventDefault(); }
});

/* ======================= inspector ======================= */
function paintInspector(){
  const el=$('#insp'), p=sel&&pieces.find(q=>q.id===sel);
  if(!p){
    el.innerHTML='<p class="empty">Nothing selected. Drag a piece up from the inventory band onto the plan. '+
      'Click to select, R rotates, arrow keys nudge an inch. Stacking: ] and [ move a piece one step forward or '+
      'back, \u2318] brings it to the front and \u2318[ sends it to the back, so a chair can sit tucked under a '+
      'table. Delete returns a piece to the inventory band.</p>';
  } else {
    const c=CATBY[p.key], on=placed(p), cl=on?clearance(p):null;
    const row=(k,v,bad)=>'<div class="kv'+(bad?' warn':'')+'"><span>'+k+'</span><span>'+v+'</span></div>';
    el.innerHTML='<div class="card">'+
      '<h4><i style="background:'+INK[c.fam]+'"></i>'+esc(disp(c))+'</h4>'+
      row('Size',num(c.w)+'&quot; &times; '+num(c.d)+'&quot;')+
      row('Rotation',p.rot+'&deg;')+
      row('Where', on ? (inAnyRoom(bbox(p))||'on the plan').toLowerCase() : 'inventory')+
      row('Stack order',(pieces.indexOf(p)+1)+' of '+pieces.length)+
      (on?row('Gap left',gap(cl.l))+row('Gap right',gap(cl.r))+
          row('Gap above',gap(cl.t))+row('Gap below',gap(cl.b)):'')+
      '<div class="row"><button id="bRot">Rotate</button><button id="bHome">To inventory</button></div>'+
      '<div class="row"><button id="bTop">Bring to front</button></div>'+
      '<div class="row"><button id="bBot">Send to back</button></div>'+
      '<div class="row"><button id="bFwd">Forward &nbsp;]</button><button id="bBack">Backward &nbsp;[</button></div>'+
      '</div>';
    $('#bRot').onclick =function(){push();p.rot=(p.rot+90)%360;render();};
    $('#bHome').onclick=function(){push();sendHome(p);render();};
    $('#bBack').onclick=function(){zMove(p,-1);};
    $('#bFwd').onclick =function(){zMove(p,1);};
    $('#bBot').onclick =function(){zMove(p,'back');};
    $('#bTop').onclick =function(){zMove(p,'front');};
  }
  let sf=0,on=0;
  for(const q of pieces){ if(!placed(q)) continue; on++;
    const c=CATBY[q.key]; sf+=c.w*c.d/144; }
  $('#nOn').textContent=on+' of '+pieces.length;
  $('#nSf').textContent=sf.toFixed(0)+' sf';
  $('#hint').innerHTML='Drag to move &nbsp;·&nbsp; R rotates &nbsp;·&nbsp; arrows nudge 1&Prime; '+
    '&nbsp;·&nbsp; [ ] forward and back &nbsp;·&nbsp; \u2318] to front, \u2318[ to back '+
    '&nbsp;·&nbsp; Delete returns it to inventory &nbsp;·&nbsp; scroll to zoom';
}

/* ======================= the exported sheet ======================= */
function wrap(t,n){ const w=t.split(/\s+/),L=[]; let c='';
  for(const x of w){ if((c+' '+x).trim().length>n){L.push(c);c=x;} else c=(c+' '+x).trim(); }
  if(c)L.push(c); return L; }

function sheetSVG(){
  const F='font-family="Helvetica,Arial,sans-serif"';
  const sched=$('#tSched').checked;
  const o=['<svg xmlns="http://www.w3.org/2000/svg" width="'+PAGE.w+'" height="'+PAGE.h+'" viewBox="0 0 '+PAGE.w+' '+PAGE.h+'">'];
  o.push('<rect x="0" y="0" width="'+PAGE.w+'" height="'+PAGE.h+'" fill="#ffffff"/>');
  const title=($('#title').value||'Layout').toUpperCase();
  o.push('<text '+F+' x="'+PAGE.x+'" y="52" font-size="17" letter-spacing="3.5" fill="#111111">'+esc(title)+'</text>');
  o.push('<line x1="'+PAGE.x+'" y1="80" x2="'+(PAGE.w-46)+'" y2="80" stroke="#111111" stroke-width=".8"/>');
  o.push('<g transform="translate('+(PAGE.x-PB[0]*PAGE.S)+','+(PAGE.y-PB[1]*PAGE.S)+') scale('+PAGE.S+')">');
  o.push(DATA.body);
  const on=pieces.filter(placed);
  for(const p of on) o.push('<g transform="translate('+p.cx+','+p.cy+') rotate('+p.rot+')">'+shape(p,'body')+'</g>');
  for(const p of [...on].sort((a,b)=>{const A=dims(a),B=dims(b);return A[0]*A[1]-B[0]*B[1];}))
    o.push('<g transform="translate('+p.cx+','+p.cy+') rotate('+p.rot+')">'+shape(p,'label')+'</g>');
  o.push('</g>');
  const pb=PAGE.y+(PB[3]-PB[1])*PAGE.S, seg=UPF*PAGE.S, sx=PAGE.x+4, sy=pb+30;
  for(let i=0;i<5;i++) o.push('<rect x="'+(sx+i*seg)+'" y="'+sy+'" width="'+seg+'" height="4.5" fill="'+(i%2?'#ffffff':'#1a1a1a')+'" stroke="#1a1a1a" stroke-width=".5"/>');
  for(let i=0;i<=5;i++) o.push('<text '+F+' x="'+(sx+i*seg)+'" y="'+(sy-3)+'" font-size="6.5" text-anchor="middle" fill="#1a1a1a">'+i+'</text>');
  o.push('<text '+F+' x="'+(sx+5*seg+5)+'" y="'+(sy+4.5)+'" font-size="6.5" fill="#1a1a1a">FEET</text>');
  o.push('<text '+F+' x="'+(PAGE.x+160)+'" y="'+(pb+39)+'" font-size="7.5" letter-spacing=".8" fill="#666666">DRAWN AT 17 x 11 IN. ALL DIMENSIONS IN INCHES.</text>');
  let ny=pb+66;
  const notes=$('#notes').value.trim();
  if(notes){
    o.push('<text '+F+' x="'+PAGE.x+'" y="'+ny+'" font-size="8" letter-spacing="1.3" fill="#111111">NOTES</text>'); ny+=14;
    notes.split(/\n+/).forEach(par=>{ wrap(par,sched?168:210).forEach(l=>{
      o.push('<text '+F+' x="'+PAGE.x+'" y="'+ny+'" font-size="8.5" fill="#333333">'+esc(l)+'</text>'); ny+=11; }); ny+=3; });
  }
  if(sched){
    const byRoom={};
    for(const p of on){ const r=inAnyRoom(bbox(p))||'OTHER'; (byRoom[r]=byRoom[r]||[]).push(CATBY[p.key]); }
    const LX=990, pretty={LIVING:'LIVING ROOM',STUDIO:'STUDIO / OFFICE'};
    let ly=110;
    o.push('<text '+F+' x="'+LX+'" y="'+ly+'" font-size="8" letter-spacing="1.3" fill="#111111">FURNITURE PLACED</text>');
    o.push('<line x1="'+LX+'" y1="'+(ly+5)+'" x2="'+(PAGE.w-46)+'" y2="'+(ly+5)+'" stroke="#111111" stroke-width=".6"/>');
    ly+=20;
    for(const r of ['BEDROOM','LIVING','STUDIO','HALL','BATH','OTHER']){
      if(!byRoom[r]) continue;
      o.push('<text '+F+' x="'+LX+'" y="'+ly+'" font-size="7.5" letter-spacing="1" fill="#888888">'+(pretty[r]||r)+'</text>'); ly+=13;
      byRoom[r].sort((a,b)=>disp(a).localeCompare(disp(b))).forEach(c=>{
        o.push('<text '+F+' x="'+LX+'" y="'+ly+'" font-size="8" fill="#222222">'+esc(c.name)+'</text>');
        o.push('<text '+F+' x="'+(LX+190)+'" y="'+ly+'" font-size="8" fill="#888888" text-anchor="end">'+num(c.w)+'&quot; x '+num(c.d)+'&quot;</text>');
        ly+=11.2; });
      ly+=8;
    }
    const off=pieces.filter(p=>!placed(p));
    if(off.length){
      o.push('<text '+F+' x="'+LX+'" y="'+ly+'" font-size="7.5" letter-spacing="1" fill="#888888">STILL IN THE INVENTORY</text>'); ly+=13;
      off.forEach(p=>{ const c=CATBY[p.key];
        o.push('<text '+F+' x="'+LX+'" y="'+ly+'" font-size="8" fill="#999999">'+esc(c.name)+'</text>');
        o.push('<text '+F+' x="'+(LX+190)+'" y="'+ly+'" font-size="8" fill="#bbbbbb" text-anchor="end">'+num(c.w)+'&quot; x '+num(c.d)+'&quot;</text>');
        ly+=11.2; });
    }
  }
  o.push('</svg>');
  return o.join('');
}

/* ======================= files ======================= */
function dl(blob,name){ const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u; a.download=name; a.click(); setTimeout(function(){URL.revokeObjectURL(u);},5000); }
function fname(ext){ return ((($('#title').value||'layout').replace(/[^\w -]/g,'').trim()
  .replace(/\s+/g,'_'))||'layout')+'.'+ext; }

$('#pdf').onclick=function(){ dl(PDF.make(sheetSVG(),PAGE.w,PAGE.h), fname('pdf')); };
$('#png').onclick=function(){
  const svg=sheetSVG(), k=3, img=new Image();
  img.onload=function(){ const cv=document.createElement('canvas');
    cv.width=PAGE.w*k; cv.height=PAGE.h*k;
    const g=cv.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,cv.width,cv.height);
    g.drawImage(img,0,0,cv.width,cv.height);
    cv.toBlob(function(b){dl(b,fname('png'));},'image/png'); };
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
};
$('#saveJson').onclick=function(){ dl(new Blob([JSON.stringify(
  {title:$('#title').value,notes:$('#notes').value,
   pieces:pieces.map(p=>({key:p.key,cx:p.cx,cy:p.cy,rot:p.rot,free:!!p.free}))},null,1)],
  {type:'application/json'}), fname('json')); };
$('#loadJson').onclick=function(){ $('#fileIn').click(); };
$('#fileIn').onchange=function(e){ const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=function(){ try{ const d=JSON.parse(r.result); push();
    const used={};
    pieces=(d.pieces||[]).map(x=>({id:uid++,key:x.key,cx:x.cx,cy:x.cy,rot:x.rot||0,free:!!x.free}));
    for(const p of pieces) used[p.key]=true;
    for(const c of DATA.cat) if(!used[c.key])
      pieces.push({id:uid++,key:c.key,cx:c.home.cx,cy:c.home.cy,rot:0,free:false});
    if(d.title) $('#title').value=d.title;
    if(d.notes!==undefined) $('#notes').value=d.notes;
    sel=null; render();
  }catch(err){ alert('That file is not a saved layout.'); } };
  r.readAsText(f); e.target.value=''; };

/* ======================= boot ======================= */
$('#clearAll').onclick=function(){ push(); pieces.forEach(sendHome); sel=null; render(); };
$('#undo').onclick=doUndo;
$('#zIn').onclick =function(){view.z=Math.min(5,view.z*1.25);applyView();};
$('#zOut').onclick=function(){view.z=Math.max(.08,view.z/1.25);applyView();};
$('#zPlan').onclick=function(){fitBox(PB);};
$('#zAll').onclick =function(){fitBox(canvasBox());};
['tClear','tSnap'].forEach(function(id){$('#'+id).addEventListener('change',render);});

packInventory();
pieces = DATA.cat.map(function(c){ return {id:uid++,key:c.key,cx:c.home.cx,cy:c.home.cy,rot:0,free:false}; });
render();
fitBox(canvasBox());
</script>
